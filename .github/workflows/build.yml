name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU for ARM64
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build and Test
        run: |
          PLATFORM=${{ matrix.arch == 'arm64' && 'linux/arm64' || 'linux/amd64' }}
          if [ "${{ matrix.arch }}" = "arm64" ]; then
              CMAKE_FLAGS="-DCMAKE_BUILD_TYPE=Release -DBUILD_EBPF_BACKEND=OFF -DSKIP_PTRACE_TESTS=ON -DSKIP_EBPF_TESTS=ON"
          else
              CMAKE_FLAGS="-DCMAKE_BUILD_TYPE=Release -DBUILD_EBPF_BACKEND=ON -DSKIP_EBPF_TESTS=ON"
          fi

          docker run --rm --platform "$PLATFORM" \
            -v ${{ github.workspace }}:/workspace -w /workspace \
            ubuntu:24.04 \
            bash -c "
              set -e
              apt-get update
              apt-get install -y build-essential cmake g++ git python3 libssl-dev
              if [ \"${{ matrix.arch }}\" = \"x86_64\" ]; then
                apt-get install -y libbpf-dev clang libelf-dev zlib1g-dev xxd
              fi
              cmake -B build $CMAKE_FLAGS
              cmake --build build -j\$(nproc)
              cd build
              ctest --output-on-failure
            "