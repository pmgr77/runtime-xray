name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            platform: linux/amd64

          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and Test
        run: |
          PLATFORM=${{ matrix.platform }}

          if [ "${{ matrix.arch }}" = "arm64" ]; then
              CMAKE_FLAGS="-DCMAKE_BUILD_TYPE=Release -DBUILD_EBPF_BACKEND=OFF -DSKIP_PTRACE_TESTS=ON -DSKIP_EBPF_TESTS=ON"
          else
              CMAKE_FLAGS="-DCMAKE_BUILD_TYPE=Release -DBUILD_EBPF_BACKEND=ON -DSKIP_EBPF_TESTS=ON"
          fi

          docker run --rm --cap-add=SYS_PTRACE --platform "$PLATFORM" \
            -v ${{ github.workspace }}:/workspace -w /workspace \
            ubuntu:24.04 \
            bash -c "
              set -e

              apt-get update
              apt-get install -y \
                build-essential \
                cmake \
                g++ \
                git \
                python3 \
                libssl-dev \
                jq

              if [ \"${{ matrix.arch }}\" = \"x86_64\" ]; then
                apt-get install -y \
                  libbpf-dev \
                  clang \
                  libelf-dev \
                  zlib1g-dev \
                  xxd
              fi

              cmake -B build $CMAKE_FLAGS
              cmake --build build -j\$(nproc)

              cd build
              ctest --output-on-failure
            "