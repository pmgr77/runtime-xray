name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU for ARM64
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build and Test
        run: |
          PLATFORM=${{ matrix.arch == 'arm64' && 'linux/arm64' || 'linux/amd64' }}

          # Default flags
          SKIP_FLAGS=""
          BUILD_FLAGS=""

          if [ "${{ matrix.arch }}" = "arm64" ]; then
            SKIP_FLAGS="-DSKIP_PTRACE_TESTS=ON -DSKIP_EBPF_TESTS=ON"
            BUILD_FLAGS="-DBUILD_EBPF_BACKEND=OFF"
          else
            SKIP_FLAGS="-DSKIP_EBPF_TESTS=ON"
            BUILD_FLAGS="-DBUILD_EBPF_BACKEND=ON"
          fi

          docker run --rm --platform "$PLATFORM" --privileged \
            -v /sys/kernel/tracing:/sys/kernel/tracing \
            -e SKIP_FLAGS="$SKIP_FLAGS" \
            -e BUILD_FLAGS="$BUILD_FLAGS" \
            -v ${{ github.workspace }}:/workspace -w /workspace \
            ubuntu:24.04 \
            bash -c "
              set -e
              apt-get update
              apt-get install -y build-essential cmake g++ git python3
              if [ \"${{ matrix.arch }}\" = \"x86_64\" ]; then
                apt-get install -y libbpf-dev clang libelf-dev zlib1g-dev xxd
              fi
              rm -rf build
              cmake -B build -DCMAKE_BUILD_TYPE=Release \$BUILD_FLAGS \$SKIP_FLAGS
              cmake --build build -j\$(nproc)
              cd build
              ctest --output-on-failure
            "